name: 3D contribution calendar

on:
  schedule:
    - cron: "41 18 * * *"   # daily, 00:11 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 3d-contrib
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate 3D calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Keep only the calendar
        run: |
          # rsvg-convert + ImageMagick measure the crop
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin imagemagick
          python3 .github/scripts/calendar_only.py \
            profile-3d-contrib/profile-night-green.svg profile-3d-contrib/calendar.svg
          # Only calendar.svg is used by the README; drop the rest.
          find profile-3d-contrib -type f ! -name calendar.svg -delete

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update 3D contribution calendar"
          file_pattern: profile-3d-contrib/calendar.svg
